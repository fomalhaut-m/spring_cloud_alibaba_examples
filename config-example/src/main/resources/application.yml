spring:
  application:
    name: nacos-config-demo
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - optional:nacos:${spring.application.name}.yml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always